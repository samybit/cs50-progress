<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener("DOMContentLoaded", function() {

                // Multiple Choice
                let buttons = document.querySelectorAll(".choice");
                let feedback1 = document.querySelector("#feedback1");

                buttons.forEach(button => {
                    button.addEventListener("click", function() {
                        // reset colors
                        buttons.forEach(b => b.style.backgroundColor = "");
                        // check correctness
                        if (button.classList.contains("correct")) {
                            button.style.backgroundColor = "green";
                            feedback1.textContent = "Correct!";
                        } else {
                            button.style.backgroundColor = "red";
                            feedback1.textContent = "Incorrect";
                        }
                    });
                });

                // Free Response
                let checkButton = document.querySelector("#check");
                let answerInput = document.querySelector("#answer");
                let feedback2 = document.querySelector("#feedback2");

                checkButton.addEventListener("click", function() {
                    let userAnswer = answerInput.value.trim().toLowerCase();
                    if (userAnswer === "cairo") {
                        answerInput.style.backgroundColor = "green";
                        feedback2.textContent = "Correct!";
                    } else {
                        answerInput.style.backgroundColor = "red";
                        feedback2.textContent = "Incorrect";
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>Which planet is known as the Red Planet?</h3>
                <button class="choice">Earth</button>
                <button class="choice">Venus</button>
                <button class="choice correct">Mars</button>
                <p id="feedback1"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>What is the capital of Egypt?</h3>
                <input type="text" id="answer">
                <button id="check">Check Answer</button>
                <p id="feedback2"></p>
            </div>
        </div>
    </body>
</html>
